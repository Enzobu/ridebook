name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
  pull_request:

jobs:
  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy prod
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/deploy-response.txt -w "%{http_code}" -X POST "https://dokploy.enzo-palermo.com/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_PROD_API_KEY }}" \
            -d '{"composeId":"${{ secrets.DOKPLOY_PROD_COMPOSE_ID }}"}')

          echo "HTTP code: $HTTP_CODE"
          cat /tmp/deploy-response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
